services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vyom-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemma-4-26b-a4b-it}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vyom-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vyom-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vyom-network

networks:
  vyom-network:
    driver: bridge
